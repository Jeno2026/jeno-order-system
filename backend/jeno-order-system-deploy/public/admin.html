<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JÉNO Admin - Manage Products</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f1ec;
    color: #4a453d;
  }
  .admin-header {
    background: #877d70;
    color: white;
    padding: 18px 24px;
    position: relative;
  }
  .admin-header h1 {
    margin: 0;
    font-size: 20px;
  }
  .admin-brand-logo {
    display: block;
    width: 150px;
    height: auto;
    margin: 0 auto;
  }
  .admin-header p {
    margin: 4px 0 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .logout-btn {
    position: absolute;
    right: 24px;
    top: 20px;
    padding: 7px 12px;
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 6px;
    background: transparent;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .admin-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }
  .panel {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .panel h2 {
    font-size: 16px;
    margin: 0 0 16px 0;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .form-row.full {
    grid-template-columns: 1fr;
  }
  label {
    display: block;
    font-size: 12px;
    color: #877d70;
    margin-bottom: 4px;
    font-weight: 600;
  }
  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d8d0c2;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea {
    min-height: 70px;
    resize: vertical;
  }
  .btn {
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: #877d70;
    color: white;
  }
  .btn-primary:hover {
    background: #6e6459;
  }
  .btn-danger {
    background: #c0564d;
    color: white;
  }
  .btn-danger:hover {
    background: #a3453d;
  }
  .btn-small {
    padding: 5px 10px;
    font-size: 12px;
  }
  .category-group {
    margin-bottom: 20px;
  }
  .category-group h3 {
    font-size: 14px;
    color: #877d70;
    border-bottom: 1px solid #e6e0d6;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    text-align: left;
    font-size: 12px;
    color: #877d70;
    padding: 6px 8px;
    border-bottom: 1px solid #e6e0d6;
  }
  td {
    padding: 8px;
    font-size: 13px;
    border-bottom: 1px solid #f0ece4;
  }
  td.actions {
    text-align: right;
    white-space: nowrap;
  }
  td.actions .btn {
    margin-left: 6px;
  }
  .empty-msg {
    color: #a49a8d;
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  .status-msg {
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .status-msg.success {
    color: #4a7a45;
  }
  .status-msg.error {
    color: #c0564d;
  }
  .admin-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    border: 1px solid #cfc7ba;
    background: transparent;
    color: #6e6459;
  }
  .tab-btn.active {
    background: #877d70;
    border-color: #877d70;
    color: white;
  }
  .admin-view {
    display: none;
  }
  .admin-view.active {
    display: block;
  }
  .order-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .order-toolbar-actions, .order-card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .order-card-actions { margin-top: 12px; }
  .order-editor {
    display: none;
    margin-bottom: 18px;
    padding: 16px;
    background: #f7f3ec;
    border-radius: 8px;
  }
  .order-editor.open { display: block; }
  .order-editor h3 { margin: 0 0 14px; font-size: 15px; }
  .order-card {
    border: 1px solid #e6e0d6;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .order-heading, .order-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .order-id {
    font-weight: 700;
    font-size: 14px;
  }
  .order-time {
    color: #877d70;
    font-size: 12px;
  }
  .order-items {
    margin: 12px 0;
    padding: 10px 0;
    border-top: 1px solid #f0ece4;
    border-bottom: 1px solid #f0ece4;
  }
  .order-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    padding: 3px 0;
  }
  .order-total {
    font-weight: 700;
  }
  .order-details {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 12px 0;
    font-size: 13px;
    color: #4a453d;
  }
  .order-details-block {
    background: #f7f3ec;
    border-radius: 8px;
    padding: 12px;
    line-height: 1.6;
  }
  .order-details-block strong {
    display: block;
    margin-bottom: 4px;
    color: #6e6459;
  }
  .status-select {
    width: auto;
    min-width: 130px;
  }
  .variant-header, .variant-row, .form-actions {
    display: flex;
    align-items: end;
    gap: 10px;
  }
  .variant-header {
    justify-content: space-between;
    align-items: center;
    margin: 18px 0 10px;
  }
  .variant-header h3 {
    margin: 0;
    font-size: 14px;
  }
  .variant-row {
    margin-bottom: 10px;
  }
  .variant-row > div:first-child {
    flex: 2;
  }
  .variant-row > div:nth-child(2) {
    flex: 1;
  }
  .variant-remove {
    flex: 0 0 auto;
  }
  .form-actions {
    margin-top: 18px;
  }
  .btn-secondary {
    background: #e6e0d6;
    color: #4a453d;
  }
  .image-upload-box {
    border: 1px dashed #cfc7ba;
    border-radius: 8px;
    padding: 12px;
    background: #faf8f4;
  }
  .image-upload-box input[type="file"] {
    border: 0;
    padding: 4px 0;
  }
  .image-preview {
    display: none;
    width: 110px;
    height: 110px;
    margin-top: 10px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #e6e0d6;
  }
  .upload-note {
    margin: 6px 0 0;
    color: #877d70;
    font-size: 11px;
  }
  @media (max-width: 600px) {
    .form-row {
      grid-template-columns: 1fr;
    }
    .order-heading, .order-footer {
      align-items: flex-start;
      flex-direction: column;
    }
    .order-details {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>


<div class="admin-header">
  <h1><img class="admin-brand-logo" src="/images/jeno-logo.png?v=20260726-white" alt="JÉNO Pâtisserie"></h1>
  <p>Manage your menu items</p>
  <button class="logout-btn" onclick="logoutAdmin()">Sign Out</button>
</div>


<div class="admin-content">


  <div class="admin-tabs">
    <button class="btn tab-btn active" id="ordersTab" onclick="showView('orders')">Orders</button>
    <button class="btn tab-btn" id="productsTab" onclick="showView('products')">Products</button>
    <button class="btn tab-btn" id="membersTab" onclick="showView('members')">Members</button>
  </div>


  <div class="admin-view active" id="ordersView">
    <div class="panel">
      <div class="order-toolbar">
        <h2>Orders</h2>
        <div class="order-toolbar-actions">
          <button class="btn btn-secondary btn-small" onclick="openOrderEditor()">Add Order</button>
          <button class="btn btn-secondary btn-small" onclick="exportOrdersCsv()">Export Excel</button>
          <button class="btn btn-primary btn-small" onclick="loadOrders()">Refresh</button>
        </div>
      </div>
      <div class="order-editor" id="orderEditor">
        <h3 id="orderEditorTitle">Add Order</h3>
        <div class="form-row">
          <div><label for="orderCustomerName">Customer name</label><input id="orderCustomerName"></div>
          <div><label for="orderCustomerPhone">Phone</label><input id="orderCustomerPhone"></div>
        </div>
        <div class="form-row">
          <div><label for="orderCustomerEmail">Email</label><input id="orderCustomerEmail" type="email"></div>
          <div><label for="orderStatus">Status</label><select id="orderStatus"></select></div>
        </div>
        <div class="form-row full">
          <div><label for="orderItemsText">Items — one per line: Name | Quantity | Unit price</label><textarea id="orderItemsText" placeholder='Chocolate Cake — 4&quot; | 1 | 35.00'></textarea></div>
        </div>
        <div class="form-row">
          <div><label for="orderFulfillmentMethod">Fulfillment</label><select id="orderFulfillmentMethod"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div>
          <div><label for="orderFulfillmentDate">Date</label><input id="orderFulfillmentDate" type="date"></div>
        </div>
        <div class="form-row">
          <div><label for="orderFulfillmentTime">Time</label><input id="orderFulfillmentTime" type="time"></div>
          <div><label for="orderAddress">Address</label><input id="orderAddress"></div>
        </div>
        <div class="form-row full"><div><label for="orderNotes">Notes</label><textarea id="orderNotes"></textarea></div></div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveOrder()">Save Order</button>
          <button class="btn btn-secondary" onclick="closeOrderEditor()">Cancel</button>
        </div>
      </div>
      <div id="orderListContainer">
        <p class="empty-msg">Loading orders...</p>
      </div>
    </div>
  </div>


  <div class="admin-view" id="productsView">
  <div class="panel" id="productFormPanel">
    <h2 id="productFormTitle">Add a New Product</h2>
    <div class="form-row">
      <div>
        <label for="productCategory">Category</label>
        <select id="productCategory" onchange="handleCategoryChange()">
          <option value="Cakes">Cakes</option>
          <option value="Cinnamon Rolls">Cinnamon Rolls</option>
          <option value="Tiramisu">Tiramisu</option>
        </select>
      </div>
      <div>
        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="e.g. Chocolate Cake">
      </div>
    </div>
    <div class="form-row full">
      <div>
        <label for="productImage">Image path</label>
        <input type="text" id="productImage" placeholder="/images/chocolate-cake.png" oninput="showImagePreview(this.value.trim())">
      </div>
    </div>
    <div class="form-row full">
      <div class="image-upload-box">
        <label for="productImageFile">Upload product image</label>
        <input type="file" id="productImageFile" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadProductImage(this)">
        <p class="upload-note">PNG, JPEG, WebP or GIF; maximum 5 MB.</p>
        <img class="image-preview" id="productImagePreview" alt="Product image preview">
      </div>
    </div>
    <div class="form-row full">
      <div>
        <label for="productDescription">Product description</label>
        <input type="text" id="productDescription" placeholder="Describe this product">
      </div>
    </div>


    <div class="variant-header">
      <h3>Subcategories and prices</h3>
      <button class="btn btn-secondary btn-small" type="button" onclick="addVariantRow()">+ Add subcategory</button>
    </div>
    <div id="variantRows"></div>


    <div class="form-actions">
      <button class="btn btn-primary" id="saveProductButton" onclick="saveProduct()">Add Product</button>
      <button class="btn btn-secondary" id="cancelEditButton" onclick="resetProductForm()" style="display:none;">Cancel edit</button>
    </div>
    <p class="status-msg" id="addStatusMsg"></p>
  </div>


  <div class="panel">
    <h2>Current Menu</h2>
    <div id="productListContainer">
      <p class="empty-msg">Loading products...</p>
    </div>
  </div>
  </div>

  <div class="admin-view" id="membersView">
    <div class="panel">
      <div class="order-toolbar">
        <h2>Members</h2>
        <button class="btn btn-primary btn-small" onclick="loadMembers()">Refresh</button>
      </div>
      <div id="memberListContainer"><p class="empty-msg">Loading members...</p></div>
    </div>
  </div>

</div>


<script>
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async function(...args) {
    const response = await nativeFetch(...args);
    if (response.status === 401) {
      window.location.replace("/login.html");
    }
    return response;
  };

  async function logoutAdmin() {
    await nativeFetch("/api/admin/logout", { method: "POST" });
    window.location.replace("/login.html");
  }

  let allProducts = [];
  let allOrders = [];
  let allMembers = [];
  let editingProductId = null;
  let editingOrderId = null;
  const orderStatuses = [
    ["awaiting_transfer", "Awaiting Transfer"],
    ["transfer_submitted", "Transfer Submitted"],
    ["payment_confirmed", "Payment Confirmed"],
    ["preparing", "Preparing"],
    ["ready", "Ready"],
    ["completed", "Completed"],
    ["cancelled", "Cancelled"],
    ["received", "Received (Legacy)"],
  ];


  function showView(view) {
    document.getElementById("ordersView").classList.toggle("active", view === "orders");
    document.getElementById("productsView").classList.toggle("active", view === "products");
    document.getElementById("membersView").classList.toggle("active", view === "members");
    document.getElementById("ordersTab").classList.toggle("active", view === "orders");
    document.getElementById("productsTab").classList.toggle("active", view === "products");
    document.getElementById("membersTab").classList.toggle("active", view === "members");
  }

  async function loadMembers() {
    const container = document.getElementById("memberListContainer");
    container.innerHTML = '<p class="empty-msg">Loading members...</p>';
    try {
      const response = await fetch("/api/admin/members");
      if (!response.ok) throw new Error("Request failed");
      allMembers = await response.json();
      if (!allMembers.length) {
        container.innerHTML = '<p class="empty-msg">No members yet.</p>';
        return;
      }
      container.innerHTML = '<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Verified</th><th>Joined</th></tr></thead><tbody>' +
        allMembers.map((member) => '<tr><td>' + escapeHtml(member.name) + '</td><td>' +
          escapeHtml(member.email) + '</td><td>' + escapeHtml(member.phone) +
          '</td><td>' + (member.verified ? "Yes" : "No") + '</td><td>' +
          new Date(member.created_at).toLocaleString() + '</td></tr>').join("") +
        '</tbody></table>';
    } catch (error) {
      container.innerHTML = '<p class="empty-msg">Could not load members. Check DATABASE_URL.</p>';
    }
  }


  async function loadOrders() {
    const container = document.getElementById("orderListContainer");
    container.innerHTML = '<p class="empty-msg">Loading orders...</p>';


    try {
      const res = await fetch("/api/orders");
      if (!res.ok) throw new Error("Request failed");
      allOrders = await res.json();
      renderOrders();
    } catch (err) {
      container.innerHTML = '<p class="empty-msg">Could not load orders.</p>';
    }
  }


  function renderOrders() {
    const container = document.getElementById("orderListContainer");


    if (allOrders.length === 0) {
      container.innerHTML = '<p class="empty-msg">No orders yet.</p>';
      return;
    }


    const sortedOrders = [...allOrders].sort((a, b) =>
      new Date(b.createdAt) - new Date(a.createdAt)
    );


    container.innerHTML = sortedOrders.map((order) => {
      const items = Object.values(order.items || {}).map((item) => {
        const qty = Number(item.qty) || 0;
        const price = Number(item.price) || 0;
        return '<div class="order-item"><span>' +
          escapeHtml(item.name || "Item") + " × " + qty +
          '</span><span>$' + (price * qty).toFixed(2) + "</span></div>";
      }).join("");


      const options = orderStatuses.map(([value, label]) =>
        '<option value="' + value + '"' +
        (order.status === value ? " selected" : "") + ">" + label + "</option>"
      ).join("");


      const customer = order.customer || {};
      const fulfillment = order.fulfillment || {};
      const payment = order.payment || {};
      const customerDetails =
        '<div class="order-details-block"><strong>Customer</strong>' +
        escapeHtml(customer.name || "Not provided") + "<br>" +
        escapeHtml(customer.phone || "") + "<br>" +
        escapeHtml(customer.email || "") + "</div>";
      const fulfillmentDetails =
        '<div class="order-details-block"><strong>Fulfillment</strong>' +
        escapeHtml(fulfillment.method === "delivery" ? "Delivery" : "Pickup") +
        (fulfillment.date ? "<br>" + escapeHtml(fulfillment.date) : "") +
        (fulfillment.time ? " at " + escapeHtml(fulfillment.time) : "") +
        (fulfillment.address ? "<br>" + escapeHtml(fulfillment.address) : "") +
        (fulfillment.notes ? "<br>Notes: " + escapeHtml(fulfillment.notes) : "") +
        "</div>";
      const paymentDetails = payment.reference
        ? '<div class="order-details-block"><strong>e-Transfer submitted</strong>' +
          "Sender: " + escapeHtml(payment.senderName || "") + "<br>" +
          "Email: " + escapeHtml(payment.senderEmail || "") + "<br>" +
          "Date: " + escapeHtml(payment.date || "") + "<br>" +
          "Amount: $" + Number(payment.amount || 0).toFixed(2) + "<br>" +
          "Reference: " + escapeHtml(payment.reference || "") + "</div>"
        : '<div class="order-details-block"><strong>Payment</strong>Waiting for e-Transfer information.</div>';


      return '<article class="order-card">' +
        '<div class="order-heading"><span class="order-id">' +
        escapeHtml(order.id) + '</span><time class="order-time">' +
        new Date(order.createdAt).toLocaleString() + "</time></div>" +
        '<div class="order-items">' + items + "</div>" +
        '<div class="order-details">' + customerDetails + fulfillmentDetails +
        paymentDetails + "</div>" +
        '<div class="order-footer"><span class="order-total">Total: $' +
        Number(order.total || 0).toFixed(2) + '</span><select class="status-select" ' +
        'aria-label="Order status" onchange="updateOrderStatus(\'' +
        encodeURIComponent(order.id) + "', this)\">" + options + "</select></div>" +
        '<div class="order-card-actions">' +
        '<button class="btn btn-secondary btn-small" onclick="openOrderEditor(\'' +
        encodeURIComponent(order.id) + '\')">Edit</button>' +
        '<button class="btn btn-danger btn-small" onclick="deleteOrder(\'' +
        encodeURIComponent(order.id) + '\')">Delete</button></div></article>';
    }).join("");
  }


  async function updateOrderStatus(encodedId, select) {
    select.disabled = true;
    try {
      const res = await fetch("/api/orders/" + encodedId, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: select.value }),
      });
      if (!res.ok) throw new Error("Request failed");
      await loadOrders();
    } catch (err) {
      alert("Could not update order status.");
      await loadOrders();
    } finally {
      select.disabled = false;
    }
  }

  function openOrderEditor(encodedId) {
    editingOrderId = encodedId ? decodeURIComponent(encodedId) : null;
    const order = editingOrderId ? allOrders.find((item) => item.id === editingOrderId) : null;
    const customer = order?.customer || {};
    const fulfillment = order?.fulfillment || {};
    document.getElementById("orderEditorTitle").textContent =
      order ? "Edit Order " + order.id : "Add Order";
    document.getElementById("orderCustomerName").value = customer.name || "";
    document.getElementById("orderCustomerPhone").value = customer.phone || "";
    document.getElementById("orderCustomerEmail").value = customer.email || "";
    document.getElementById("orderItemsText").value = Object.values(order?.items || {}).map((item) =>
      (item.name || "Item") + " | " + (Number(item.qty) || 1) +
      " | " + (Number(item.price) || 0).toFixed(2)
    ).join("\n");
    document.getElementById("orderFulfillmentMethod").value = fulfillment.method || "pickup";
    document.getElementById("orderFulfillmentDate").value = fulfillment.date || "";
    document.getElementById("orderFulfillmentTime").value = fulfillment.time || "";
    document.getElementById("orderAddress").value = fulfillment.address || "";
    document.getElementById("orderNotes").value = fulfillment.notes || "";
    document.getElementById("orderStatus").innerHTML = orderStatuses.map(([value, label]) =>
      '<option value="' + value + '"' + (value === (order?.status || "awaiting_transfer") ? " selected" : "") +
      ">" + label + "</option>"
    ).join("");
    document.getElementById("orderEditor").classList.add("open");
  }

  function closeOrderEditor() {
    editingOrderId = null;
    document.getElementById("orderEditor").classList.remove("open");
  }

  async function saveOrder() {
    const parsedItems = document.getElementById("orderItemsText").value.split("\n")
      .map((line) => line.trim()).filter(Boolean).map((line) => {
        const parts = line.split("|").map((part) => part.trim());
        return { name: parts[0], qty: Number(parts[1]), price: Number(parts[2]) };
      });
    const customer = {
      name: document.getElementById("orderCustomerName").value.trim(),
      phone: document.getElementById("orderCustomerPhone").value.trim(),
      email: document.getElementById("orderCustomerEmail").value.trim(),
    };
    const fulfillment = {
      method: document.getElementById("orderFulfillmentMethod").value,
      date: document.getElementById("orderFulfillmentDate").value,
      time: document.getElementById("orderFulfillmentTime").value,
      address: document.getElementById("orderAddress").value.trim(),
      notes: document.getElementById("orderNotes").value.trim(),
    };
    if (!customer.name || !customer.phone || !customer.email || !fulfillment.date ||
        !parsedItems.length || parsedItems.some((item) =>
          !item.name || !Number.isInteger(item.qty) || item.qty < 1 ||
          !Number.isFinite(item.price) || item.price < 0)) {
      alert("Complete the customer, date, and items using: Name | Quantity | Unit price");
      return;
    }
    const items = {};
    parsedItems.forEach((item, index) => { items["manual_item_" + index] = item; });
    const payload = {
      customer, fulfillment, items,
      total: parsedItems.reduce((sum, item) => sum + item.price * item.qty, 0),
      paymentMethod: "etransfer",
      status: document.getElementById("orderStatus").value,
    };
    try {
      const res = await fetch(editingOrderId
        ? "/api/orders/" + encodeURIComponent(editingOrderId) : "/api/orders", {
        method: editingOrderId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error();
      closeOrderEditor();
      await loadOrders();
    } catch (err) { alert("Could not save the order."); }
  }

  async function deleteOrder(encodedId) {
    const id = decodeURIComponent(encodedId);
    if (!confirm("Delete order " + id + "? This cannot be undone.")) return;
    try {
      const res = await fetch("/api/orders/" + encodeURIComponent(id), { method: "DELETE" });
      if (!res.ok) throw new Error();
      await loadOrders();
    } catch (err) { alert("Could not delete the order."); }
  }

  function csvCell(value) {
    let text = value == null ? "" : String(value);
    if (/^[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function exportOrdersCsv() {
    if (!allOrders.length) return alert("There are no orders to export.");
    const headers = ["Order ID","Created At","Status","Customer","Phone","Email","Items",
      "Total","Fulfillment","Date","Time","Address","Notes","Transfer Sender",
      "Transfer Email","Transfer Date","Transfer Amount","Transfer Reference"];
    const rows = allOrders.map((order) => {
      const customer = order.customer || {}, fulfillment = order.fulfillment || {};
      const payment = order.payment || {};
      const items = Object.values(order.items || {}).map((item) =>
        (item.name || "Item") + " × " + (Number(item.qty) || 0) +
        " @ $" + (Number(item.price) || 0).toFixed(2)).join("; ");
      return [order.id,order.createdAt,order.status,customer.name,customer.phone,customer.email,
        items,Number(order.total || 0).toFixed(2),fulfillment.method,fulfillment.date,
        fulfillment.time,fulfillment.address,fulfillment.notes,payment.senderName,
        payment.senderEmail,payment.date,payment.amount == null ? "" :
        Number(payment.amount).toFixed(2),payment.reference];
    });
    const csv = "\uFEFF" + [headers, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    link.download = "jeno-orders-" + new Date().toISOString().slice(0, 10) + ".csv";
    link.click();
    URL.revokeObjectURL(link.href);
  }


  // ---------- 讀取商品清單 ----------
  async function loadProducts() {
    try {
      const res = await fetch("/api/products");
      allProducts = await res.json();
      renderProductList();
    } catch (err) {
      document.getElementById("productListContainer").innerHTML =
        '<p class="empty-msg">Could not load products. Is the server running?</p>';
    }
  }


  // ---------- 依分類渲染商品清單 ----------
  function renderProductList() {
    const container = document.getElementById("productListContainer");


    if (allProducts.length === 0) {
      container.innerHTML = '<p class="empty-msg">No products yet.</p>';
      return;
    }


    // 依 category 分組
    const groups = {};
    for (const p of allProducts) {
      if (!groups[p.category]) groups[p.category] = [];
      groups[p.category].push(p);
    }


    let html = "";
    for (const category in groups) {
      html += '<div class="category-group">';
      html += "<h3>" + escapeHtml(category) + "</h3>";
      html += "<table><thead><tr><th>Name</th><th>Price</th><th></th></tr></thead><tbody>";


      for (const p of groups[category]) {
        html += "<tr>";
        html += "<td>" + escapeHtml(p.name) + "</td>";
        const priceSummary = Array.isArray(p.options) && p.options.length
          ? p.options.map((option) =>
              escapeHtml(option.label) + " $" + Number(option.price).toFixed(2)
            ).join("<br>")
          : "$" + Number(p.price).toFixed(2);
        html += "<td>" + priceSummary + "</td>";
        html += '<td class="actions">';
        html += '<button class="btn btn-primary btn-small" onclick="startEdit(\'' + p.id + '\')">Edit</button>';
        html += '<button class="btn btn-danger btn-small" onclick="deleteProduct(\'' + p.id + '\')">Delete</button>';
        html += "</td>";
        html += "</tr>";
      }


      html += "</tbody></table></div>";
    }


    container.innerHTML = html;
  }


  // 避免商品名稱裡有特殊字元(例如 <script>)破壞頁面結構
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.innerText = str;
    return div.innerHTML;
  }


  function categoryDefaults(category) {
    if (category === "Cakes") {
      return [
        { label: '4"', price: "" },
        { label: '6"', price: "" },
        { label: '8"', price: "" },
      ];
    }
    if (category === "Cinnamon Rolls") {
      return [
        { label: "1 roll", price: "" },
        { label: "Dozen (12)", price: "" },
      ];
    }
    return [{ label: "Individual", price: "" }];
  }


  function renderVariantRows(options) {
    const rows = options && options.length
      ? options
      : categoryDefaults(document.getElementById("productCategory").value);
    document.getElementById("variantRows").innerHTML = rows.map((option) =>
      '<div class="variant-row">' +
        '<div><label>Subcategory</label><input class="variant-label" type="text" ' +
        'placeholder="e.g. 4&quot;" value="' + escapeAttr(option.label || "") + '"></div>' +
        '<div><label>Price ($)</label><input class="variant-price" type="number" ' +
        'min="0" step="0.01" value="' +
        (option.price === "" ? "" : Number(option.price)) + '"></div>' +
        '<button class="btn btn-danger btn-small variant-remove" type="button" ' +
        'onclick="removeVariantRow(this)">Remove</button>' +
      "</div>"
    ).join("");
  }


  function addVariantRow() {
    const wrapper = document.createElement("div");
    wrapper.className = "variant-row";
    wrapper.innerHTML =
      '<div><label>Subcategory</label><input class="variant-label" type="text" placeholder="e.g. 4&quot;"></div>' +
      '<div><label>Price ($)</label><input class="variant-price" type="number" min="0" step="0.01"></div>' +
      '<button class="btn btn-danger btn-small variant-remove" type="button" onclick="removeVariantRow(this)">Remove</button>';
    document.getElementById("variantRows").appendChild(wrapper);
  }


  function removeVariantRow(button) {
    const rows = document.querySelectorAll(".variant-row");
    if (rows.length === 1) {
      showAddStatus("At least one subcategory is required.", "error");
      return;
    }
    button.closest(".variant-row").remove();
  }


  function handleCategoryChange() {
    renderVariantRows(categoryDefaults(document.getElementById("productCategory").value));
  }


  function getFormOptions() {
    const rows = [...document.querySelectorAll(".variant-row")];
    return rows.map((row, index) => {
      const label = row.querySelector(".variant-label").value.trim();
      const price = Number(row.querySelector(".variant-price").value);
      return {
        value: slugOption(label, index),
        label,
        price,
      };
    });
  }


  function slugOption(label, index) {
    const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return slug || "option-" + (index + 1);
  }


  function escapeAttr(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  function optionTypeForCategory(category) {
    if (category === "Cakes") return "size";
    if (category === "Cinnamon Rolls") return "pack";
    return "quantity";
  }


  async function uploadProductImage(input) {
    const file = input.files && input.files[0];
    if (!file) return;


    const allowedTypes = ["image/png", "image/jpeg", "image/webp", "image/gif"];
    if (!allowedTypes.includes(file.type)) {
      showAddStatus("Please choose a PNG, JPEG, WebP, or GIF image.", "error");
      input.value = "";
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showAddStatus("Image must be smaller than 5 MB.", "error");
      input.value = "";
      return;
    }


    showAddStatus("Uploading image...", "success");
    try {
      const data = await readFileAsDataUrl(file);
      const res = await fetch("/api/uploads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, data }),
      });
      if (!res.ok) throw new Error("Upload failed");


      const result = await res.json();
      document.getElementById("productImage").value = result.image;
      showImagePreview(result.image);
      showAddStatus("Image uploaded!", "success");
    } catch (err) {
      showAddStatus("Could not upload the image.", "error");
    }
  }


  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }


  function showImagePreview(src) {
    const preview = document.getElementById("productImagePreview");
    if (!src) {
      preview.style.display = "none";
      preview.removeAttribute("src");
      return;
    }
    preview.src = src;
    preview.style.display = "block";
  }


  function emojiForCategory(category) {
    if (category === "Cakes") return "🍰";
    if (category === "Cinnamon Rolls") return "🌀";
    if (category === "Tiramisu") return "🍮";
    return "🍽️";
  }


  async function saveProduct() {
    const category = document.getElementById("productCategory").value;
    const name = document.getElementById("productName").value.trim();
    const image = document.getElementById("productImage").value.trim();
    const description = document.getElementById("productDescription").value.trim();
    const existingProduct = editingProductId
      ? allProducts.find((product) => product.id === editingProductId)
      : null;
    const emoji = existingProduct && existingProduct.category === category
      ? existingProduct.emoji
      : emojiForCategory(category);
    const options = getFormOptions();


    if (!name) {
      showAddStatus("Please enter a product name.", "error");
      return;
    }
    if (options.some((option) => !option.label || !Number.isFinite(option.price) || option.price < 0)) {
      showAddStatus("Every subcategory needs a name and valid price.", "error");
      return;
    }


    const payload = {
      category,
      name,
      image,
      description,
      emoji,
      price: options[0].price,
      optionType: optionTypeForCategory(category),
      options: category === "Tiramisu" && options.length === 1
        ? []
        : options,
    };


    const url = editingProductId
      ? "/api/products/" + editingProductId
      : "/api/products";


    try {
      const res = await fetch(url, {
        method: editingProductId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("Request failed");


      showAddStatus(editingProductId ? "Product updated!" : "Product added!", "success");
      resetProductForm();
      await loadProducts();
    } catch (err) {
      showAddStatus("Something went wrong. Please try again.", "error");
    }
  }


  function showAddStatus(message, type) {
    const el = document.getElementById("addStatusMsg");
    el.innerText = message;
    el.className = "status-msg " + type;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 2500);
  }


  // ---------- 把商品資料帶回完整表單編輯 ----------
  function startEdit(id) {
    const product = allProducts.find((p) => p.id === id);
    if (!product) return;


    editingProductId = id;
    document.getElementById("productFormTitle").innerText = "Edit Product";
    document.getElementById("saveProductButton").innerText = "Save Changes";
    document.getElementById("cancelEditButton").style.display = "";
    document.getElementById("productCategory").value = product.category;
    document.getElementById("productName").value = product.name;
    document.getElementById("productImage").value = product.image || "";
    document.getElementById("productImageFile").value = "";
    showImagePreview(product.image || "");
    document.getElementById("productDescription").value = product.description || "";
    renderVariantRows(
      Array.isArray(product.options) && product.options.length
        ? product.options
        : [{ label: "Individual", price: product.price }]
    );
    document.getElementById("productFormPanel").scrollIntoView({ behavior: "smooth" });
  }


  function resetProductForm() {
    editingProductId = null;
    document.getElementById("productFormTitle").innerText = "Add a New Product";
    document.getElementById("saveProductButton").innerText = "Add Product";
    document.getElementById("cancelEditButton").style.display = "none";
    document.getElementById("productCategory").value = "Cakes";
    document.getElementById("productName").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productImageFile").value = "";
    showImagePreview("");
    document.getElementById("productDescription").value = "";
    renderVariantRows(categoryDefaults("Cakes"));
  }


  // ---------- 刪除商品 ----------
  async function deleteProduct(id) {
    const product = allProducts.find((p) => p.id === id);
    if (!product) return;


    const confirmed = confirm('Delete "' + product.name + '"? This cannot be undone.');
    if (!confirmed) return;


    try {
      const res = await fetch("/api/products/" + id, { method: "DELETE" });
      if (!res.ok) throw new Error("Request failed");
      loadProducts();
    } catch (err) {
      alert("Could not delete product. Please try again.");
    }
  }


  loadOrders();
  loadProducts();
  loadMembers();
  resetProductForm();
</script>
